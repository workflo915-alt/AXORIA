name: AXORIA premium character hero
on:
  push:
    branches: [phase-4-meta-tracking]
    paths:
      - '.github/workflows/hero-character-fan.yml'
      - 'scripts/hero_character_fan.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-meta-tracking
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply premium hero patch
        run: python scripts/hero_character_fan.py
      - name: Commit premium hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "hero: add premium character fan with theme art direction"
          git push origin HEAD:phase-4-meta-tracking
