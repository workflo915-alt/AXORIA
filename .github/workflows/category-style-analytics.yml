name: AXORIA Category Style Analytics

on:
  push:
    branches:
      - phase-5-launch-hardening
    paths:
      - 'scripts/category_style_analytics_v2.py'
      - '.github/workflows/category-style-analytics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase-5-launch-hardening
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/category_style_analytics_v2.py

      - name: Validate JavaScript and analytics markers
        shell: bash
        run: |
          git diff --check
          grep -q "category_views" index.html
          grep -q "category_interest_stats" admin.html
          grep -q "Catégories & intérêt" admin.html
          grep -q "data-theme=\"dark\".*cat-chip" index.html
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for filename in ('index.html','admin.html'):
              html=Path(filename).read_text(encoding='utf-8')
              for m in re.finditer(r'<script([^>]*)>(.*?)</script>',html,re.S|re.I):
                  attrs,body=m.group(1),m.group(2).strip()
                  if not body or 'application/ld+json' in attrs.lower():
                      continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                      f.write(body); path=f.name
                  subprocess.run(['node','--check',path],check=True)
          print('inline JavaScript syntax OK')
          PY

      - name: Commit generated UI changes
        shell: bash
        run: |
          if git diff --quiet -- index.html admin.html; then
            echo "No UI changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin.html
          git commit -m "analytics: style categories and show interest stats"
          git push origin HEAD:phase-5-launch-hardening
