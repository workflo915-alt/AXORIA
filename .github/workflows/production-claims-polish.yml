name: AXORIA Production Claims Polish

on:
  push:
    branches: [seo-awareness-expansion]
    paths:
      - 'scripts/production_claims_polish.py'
      - '.github/workflows/production-claims-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-awareness-expansion
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/production_claims_polish.py
      - name: Validate
        shell: bash
        run: |
          git diff --check
          ! grep -q "soulager la douleur" index.html
          ! grep -q "stimuler la circulation" index.html
          ! grep -q "réduit les risques" index.html
          grep -q "Aide au retour et au maintien vers un alignement naturel" index.html
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, json
          html=Path('index.html').read_text(encoding='utf-8')
          for m in re.finditer(r'<script([^>]*)>(.*?)</script>',html,re.S|re.I):
              attrs,body=m.group(1),m.group(2).strip()
              if not body: continue
              if 'application/ld+json' in attrs.lower(): json.loads(body); continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                  f.write(body); path=f.name
              subprocess.run(['node','--check',path],check=True)
          print('production claims validation passed')
          PY
      - name: Commit generated change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'content: align product copy with wellness positioning'
          git push origin HEAD:seo-awareness-expansion
