name: AXORIA newsletter persistence

on:
  push:
    branches: [phase-4-meta-tracking]
    paths:
      - '.github/workflows/newsletter-persistence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-meta-tracking
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Wire newsletter to Supabase
        run: python scripts/newsletter_persistence.py
      - name: Commit newsletter persistence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html supabase/newsletter_subscribers.sql
          if git diff --cached --quiet; then
            echo "No newsletter changes to commit"
          else
            git commit -m "sales: persist newsletter subscribers in Supabase"
            git push origin HEAD:phase-4-meta-tracking
          fi
