name: AXORIA Final Polish 1

on:
  push:
    branches:
      - polish-1-scroll-characters
    paths:
      - 'scripts/polish1_scroll_characters.py'
      - '.github/workflows/polish1-scroll-characters.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: polish-1-scroll-characters
          fetch-depth: 0

      - name: Apply polish patch
        run: python scripts/polish1_scroll_characters.py

      - name: Validate generated storefront
        shell: bash
        run: |
          git diff --check
          grep -q 'character-bridge' index.html
          grep -q 'hero-character-fan-v4' index.html
          grep -q 'sessionStorage' index.html
          grep -q "classList.remove('in')" index.html
          grep -q 'heroOrbitMark' index.html
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, json
          html=Path('index.html').read_text(encoding='utf-8')
          for m in re.finditer(r'<script([^>]*)>(.*?)</script>',html,re.S|re.I):
              attrs,body=m.group(1),m.group(2).strip()
              if not body: continue
              if 'application/ld+json' in attrs.lower():
                  json.loads(body); continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                  f.write(body); path=f.name
              subprocess.run(['node','--check',path],check=True)
          print('Storefront inline JavaScript syntax OK')
          PY

      - name: Commit generated storefront
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No storefront changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'polish: replay scroll reveals and move characters into bridge'
          git push origin HEAD:polish-1-scroll-characters
