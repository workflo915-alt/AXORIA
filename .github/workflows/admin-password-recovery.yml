name: AXORIA Admin Password Recovery

on:
  push:
    branches:
      - security-phase-1
    paths:
      - 'scripts/add_admin_password_recovery.py'
      - '.github/workflows/admin-password-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-password-recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security-phase-1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply admin password recovery
        run: python scripts/add_admin_password_recovery.py

      - name: Validate admin auth flow
        shell: bash
        run: |
          git diff --check
          grep -q 'id="forgotBtn"' admin.html
          grep -q 'resetPasswordForEmail' admin.html
          grep -q 'PASSWORD_RECOVERY' admin.html
          grep -q 'updateUser({password:newPassword})' admin.html

      - name: Commit admin update if needed
        shell: bash
        run: |
          if git diff --quiet -- admin.html; then
            echo "No admin.html changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "admin: add secure password recovery"
          git push origin HEAD:security-phase-1
