name: AXORIA Phase 1 Cleanup

on:
  push:
    branches:
      - security-phase-1
    paths:
      - 'scripts/phase1_cleanup.py'
      - '.github/workflows/phase1-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-storefront:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security-phase-1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Phase 1 cleanup
        run: python scripts/phase1_cleanup.py

      - name: Validate generated storefront
        shell: bash
        run: |
          git diff --check
          ! grep -q 'Kaltommohamed1965' index.html
          ! grep -q 'ADMIN_RECOVERY_ANSWER' index.html
          ! grep -q 'axoria_admin_pin' index.html
          ! grep -q 'axoria_admin_recovery' index.html

      - name: Commit cleanup if needed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "security: remove legacy storefront admin and PIN"
          git push origin HEAD:security-phase-1
