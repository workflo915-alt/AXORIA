name: AXORIA Final Visual Polish V2

on:
  push:
    branches:
      - final-visual-polish
    paths:
      - 'scripts/final_visual_polish_v2.py'
      - '.github/workflows/final-visual-polish-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: final-visual-polish
          fetch-depth: 0

      - name: Apply visual polish v2
        run: python scripts/final_visual_polish_v2.py

      - name: Validate generated HTML and JS
        shell: bash
        run: |
          git diff --check
          grep -q "const bridge=document.getElementById('characterBridge')" index.html
          grep -q "const scrollP=clamp((enterStart-rect.top)" index.html
          grep -q "height:clamp(235px,27vw,320px)" index.html
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, json
          html=Path('index.html').read_text(encoding='utf-8')
          for m in re.finditer(r'<script([^>]*)>(.*?)</script>',html,re.S|re.I):
              attrs,body=m.group(1),m.group(2).strip()
              if not body: continue
              if 'application/ld+json' in attrs.lower():
                  json.loads(body); continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                  f.write(body); path=f.name
              subprocess.run(['node','--check',path],check=True)
          print('Visual polish v2 validation passed.')
          PY

      - name: Commit generated change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No generated change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'polish: tighten character bridge and restore scroll fan'
          git push origin HEAD:final-visual-polish
