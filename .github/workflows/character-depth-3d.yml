name: AXORIA Character Depth 3D

on:
  push:
    branches: [final-visual-polish]
    paths:
      - 'scripts/character_depth_3d.py'
      - '.github/workflows/character-depth-3d.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-visual-polish
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/character_depth_3d.py
      - name: Validate
        shell: bash
        run: |
          git diff --check
          grep -q 'perspective:900px' index.html
          grep -q 'translate3d(-50%,${y.toFixed(1)}px,${z.toFixed(1)}px)' index.html
          grep -q 'const depthStart=mobile?.80:.74' index.html
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, json
          html=Path('index.html').read_text(encoding='utf-8')
          for m in re.finditer(r'<script([^>]*)>(.*?)</script>',html,re.S|re.I):
              attrs,body=m.group(1),m.group(2).strip()
              if not body: continue
              if 'application/ld+json' in attrs.lower(): json.loads(body); continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                  f.write(body); path=f.name
              subprocess.run(['node','--check',path],check=True)
          print('3D character depth validation passed')
          PY
      - name: Commit generated change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'polish: add smooth 3D depth to character fan'
          git push origin HEAD:final-visual-polish
