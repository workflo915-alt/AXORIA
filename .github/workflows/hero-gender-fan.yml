name: AXORIA hero gender fan

on:
  push:
    branches: [phase-4-meta-tracking]
    paths:
      - 'scripts/hero_gender_fan.py'
      - '.github/workflows/hero-gender-fan.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-meta-tracking
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply gender fan layout
        run: python scripts/hero_gender_fan.py
      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "hero: group men and women around athlete duo"
            git push origin HEAD:phase-4-meta-tracking
          fi
