name: AXORIA core sales readiness

on:
  push:
    branches: [phase-4-meta-tracking]
    paths:
      - 'scripts/sales_readiness_core_fix.py'
      - '.github/workflows/sales-readiness-core-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-meta-tracking
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply core sales readiness fixes
        run: python scripts/sales_readiness_core_fix.py
      - name: Commit storefront fixes
        run: |
          if git diff --quiet -- index.html; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "sales: fix purchase dedup and missing asset handling"
          git push origin HEAD:phase-4-meta-tracking
