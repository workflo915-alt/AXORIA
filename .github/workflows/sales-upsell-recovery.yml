name: AXORIA sales upsell recovery
on:
  push:
    branches: [phase-4-meta-tracking]
    paths:
      - '.github/workflows/sales-upsell-recovery.yml'
      - '.github/scripts/patch_upsell_recovery.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-meta-tracking
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply cart upsell and recovery
        run: python .github/scripts/patch_upsell_recovery.py
      - name: Commit cart conversion changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "sales: add cart upsell and same-device recovery"
          git push origin HEAD:phase-4-meta-tracking
