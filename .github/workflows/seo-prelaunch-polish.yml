name: AXORIA SEO prelaunch polish

on:
  push:
    branches: [phase-4-meta-tracking]
    paths:
      - '.github/workflows/seo-prelaunch-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-meta-tracking
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply pre-launch SEO polish
        run: python scripts/seo_prelaunch_polish.py
      - name: Commit SEO polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No SEO polish changes to commit"
          else
            git commit -m "seo: polish crawler and social metadata"
            git push origin HEAD:phase-4-meta-tracking
          fi
