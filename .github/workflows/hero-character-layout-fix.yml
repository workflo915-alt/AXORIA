name: AXORIA hero character layout fix

on:
  push:
    branches: [phase-4-meta-tracking]
    paths:
      - 'scripts/hero_character_layout_fix.py'
      - '.github/workflows/hero-character-layout-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-4-meta-tracking
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fix hero character layout
        run: python scripts/hero_character_layout_fix.py
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "hero: fix character clipping and athlete balance"
          git push origin HEAD:phase-4-meta-tracking
