name: AXORIA SEO Home Guides Link

on:
  push:
    branches: [seo-awareness-expansion]
    paths:
      - 'scripts/seo_home_guides_link.py'
      - '.github/workflows/seo-home-guides-link.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-awareness-expansion
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/seo_home_guides_link.py
      - name: Validate
        shell: bash
        run: |
          git diff --check
          grep -q 'guidesLabel' index.html
          grep -q 'href="guides.html"' index.html
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, json, xml.etree.ElementTree as ET
          files=['index.html','guides.html','fr/guides/posture-bureau.html','fr/guides/recuperation-sportive.html','ar/guides/posture-bureau.html','ar/guides/recuperation-sportive.html']
          for fp in files:
              html=Path(fp).read_text(encoding='utf-8')
              for m in re.finditer(r'<script([^>]*)>(.*?)</script>',html,re.S|re.I):
                  attrs,body=m.group(1),m.group(2).strip()
                  if not body: continue
                  if 'application/ld+json' in attrs.lower(): json.loads(body); continue
                  with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                      f.write(body); path=f.name
                  subprocess.run(['node','--check',path],check=True)
          ET.parse('sitemap.xml')
          print('SEO validation passed')
          PY
      - name: Commit generated change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'seo: link awareness guides from storefront footer'
          git push origin HEAD:seo-awareness-expansion
