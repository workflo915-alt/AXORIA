name: AXORIA Sticky Cart Motion Fix

on:
  push:
    branches: [final-visual-polish]
    paths:
      - 'scripts/sticky_cart_motion_fix.py'
      - '.github/workflows/sticky-cart-motion-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: final-visual-polish
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/sticky_cart_motion_fix.py
      - name: Validate
        shell: bash
        run: |
          git diff --check
          grep -q 'transition:opacity .72s cubic-bezier(.2,.7,.2,1),transform .78s' index.html
          grep -q 'visibility:hidden;pointer-events:none' index.html
          grep -q 'sticky-buybar.show{opacity:1;visibility:visible;pointer-events:auto' index.html
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile, json
          html=Path('index.html').read_text(encoding='utf-8')
          for m in re.finditer(r'<script([^>]*)>(.*?)</script>',html,re.S|re.I):
              attrs,body=m.group(1),m.group(2).strip()
              if not body: continue
              if 'application/ld+json' in attrs.lower(): json.loads(body); continue
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
                  f.write(body); path=f.name
              subprocess.run(['node','--check',path],check=True)
          print('sticky cart motion validation passed')
          PY
      - name: Commit generated change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'polish: smooth sticky cart motion with reveal timing'
          git push origin HEAD:final-visual-polish
